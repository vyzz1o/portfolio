<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23c9a84c'/><text x='50' y='72' font-family='Georgia,serif' font-size='64' font-weight='300' text-anchor='middle' fill='%231a1008'>W</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wish W 後台">
<meta name="theme-color" content="#c9a84c">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W Studio — 後台管理</title>
<style>

:root{--cream:#f2ead8;--sepia:#c4a882;--warm-brown:#8b6b4a;--dark-brown:#3d2b1f;--near-black:#1a1008;--gold:#c9a84c;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1008;color:#f2ead8;font-family:'Georgia',serif;min-height:100vh;}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#2a1a0e 0%,#1a1008 70%);}
.login-box{border:1px solid rgba(196,168,130,0.2);padding:3rem;width:380px;background:rgba(61,43,31,0.4);text-align:center;}
.login-logo{font-size:2.2rem;font-style:italic;color:var(--gold);margin-bottom:0.3rem;}
.login-sub{font-size:0.65rem;letter-spacing:0.35em;color:var(--warm-brown);text-transform:uppercase;margin-bottom:0.5rem;}
.login-desc{font-size:0.82rem;color:var(--sepia);font-style:italic;margin-bottom:2.5rem;line-height:1.6;}
.btn-google{width:100%;padding:0.9rem 1.5rem;background:var(--gold);color:#1a1008;border:none;font-family:Georgia,serif;font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.8rem;transition:background 0.2s;}
.btn-google:hover{background:#e0bc5a;}
.login-note{font-size:0.65rem;color:var(--warm-brown);margin-top:1.2rem;opacity:0.7;}
.err-msg{color:#e07070;font-size:0.78rem;margin-top:1rem;min-height:1.2rem;}

#admin-panel{display:none;}
.admin-nav{position:sticky;top:0;z-index:100;background:#1a1008;border-bottom:1px solid rgba(196,168,130,0.1);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;}
.admin-nav-logo{display:flex;align-items:center;gap:0.3rem;}
.nav-user{display:flex;align-items:center;gap:0.8rem;font-size:0.7rem;color:var(--warm-brown);}
.nav-avatar{width:28px;height:28px;border-radius:50%;border:1px solid rgba(196,168,130,0.3);object-fit:cover;}
.btn-sm{background:transparent;border:1px solid rgba(196,168,130,0.2);color:var(--sepia);padding:0.3rem 0.8rem;font-size:0.65rem;letter-spacing:0.15em;cursor:pointer;font-family:Georgia,serif;text-transform:uppercase;transition:all 0.2s;}
.btn-sm:hover{border-color:var(--gold);color:var(--gold);}

.admin-body{padding:2rem;max-width:1100px;margin:0 auto;}
.card{border:1px solid rgba(196,168,130,0.15);padding:2rem;background:rgba(61,43,31,0.25);margin-bottom:2.5rem;}
.card-title{font-size:0.7rem;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:1.5rem;padding-bottom:0.8rem;border-bottom:1px solid rgba(196,168,130,0.1);display:flex;align-items:center;justify-content:space-between;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-field{margin-bottom:1rem;}
.form-field.full{grid-column:1/-1;}
.form-field label{display:block;font-size:0.6rem;letter-spacing:0.2em;color:var(--sepia);text-transform:uppercase;margin-bottom:0.4rem;}
.form-field input,.form-field select{width:100%;padding:0.6rem 0.8rem;background:rgba(0,0,0,0.3);border:1px solid rgba(196,168,130,0.15);color:var(--cream);font-size:0.85rem;font-family:Georgia,serif;outline:none;transition:border-color 0.2s;}
.form-field input:focus,.form-field select:focus{border-color:var(--gold);}
.form-field select option{background:#3d2b1f;}
.drop-zone{border:1px dashed rgba(196,168,130,0.3);padding:2rem;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(0,0,0,0.15);margin-bottom:0.8rem;}
.drop-zone.dragover{border-color:var(--gold);background:rgba(201,168,76,0.05);}
.drop-zone p{color:var(--warm-brown);font-size:0.78rem;line-height:1.7;}
.drop-zone strong{color:var(--gold);}
.cover-preview{width:100%;max-height:180px;object-fit:cover;display:none;border:1px solid rgba(196,168,130,0.2);margin-top:0.8rem;}
.thumbs{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.8rem;}
.thumb{position:relative;width:76px;height:76px;}
.thumb img{width:100%;height:100%;object-fit:cover;border:1px solid rgba(196,168,130,0.2);}
.thumb-del{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:rgba(26,16,8,0.9);border:1px solid rgba(255,100,100,0.4);color:#e07070;font-size:0.55rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.upload-progress{height:2px;background:rgba(196,168,130,0.1);margin-top:1rem;display:none;}
.upload-progress-bar{height:100%;background:var(--gold);width:0%;transition:width 0.3s;}
.upload-status{font-size:0.72rem;color:var(--sepia);margin-top:0.5rem;min-height:1rem;}
.btn-primary{background:var(--gold);color:#1a1008;border:none;padding:0.65rem 1.8rem;font-family:Georgia,serif;font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;transition:background 0.2s;display:inline-flex;align-items:center;gap:0.5rem;margin-top:0.5rem;}
.btn-primary:hover{background:#e0bc5a;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-danger{background:transparent;border:1px solid rgba(255,100,100,0.3);color:#e07070;padding:0.65rem 1.2rem;font-family:Georgia,serif;font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;margin-top:0.5rem;margin-left:0.5rem;}
.btn-danger:hover{background:rgba(224,112,112,0.1);}

.tab-bar{display:flex;margin-bottom:1rem;border-bottom:1px solid rgba(196,168,130,0.1);flex-wrap:wrap;}
.tab{padding:0.55rem 1.1rem;font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;color:var(--warm-brown);border:none;border-bottom:2px solid transparent;transition:all 0.2s;background:none;font-family:Georgia,serif;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.sort-hint{font-size:0.62rem;color:var(--warm-brown);font-style:italic;margin-bottom:0.8rem;opacity:0.65;}
.sort-saved{font-size:0.62rem;color:var(--gold);margin-left:0.8rem;opacity:0;transition:opacity 0.3s;font-style:italic;}
.sort-saved.show{opacity:1;}

.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:1rem;}
.work-item{border:1px solid rgba(196,168,130,0.1);background:rgba(61,43,31,0.2);overflow:hidden;position:relative;transition:box-shadow 0.2s;}
.work-item.drag-over{box-shadow:0 0 0 2px var(--gold);}
.work-item.dragging-item{opacity:0.4;}
.work-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.work-info{padding:0.6rem;}
.work-name{font-size:0.8rem;color:var(--cream);margin-bottom:0.12rem;}
.work-meta{font-size:0.58rem;color:var(--warm-brown);text-transform:uppercase;}
.work-count{font-size:0.52rem;color:var(--sepia);margin-top:0.08rem;}
.work-tag{display:inline-block;font-size:0.5rem;border:1px solid rgba(196,168,130,0.18);padding:0.08rem 0.35rem;text-transform:uppercase;color:var(--sepia);margin-top:0.2rem;}
.work-actions{position:absolute;top:0.4rem;right:0.4rem;display:flex;gap:0.3rem;opacity:0;transition:opacity 0.2s;}
.work-item:hover .work-actions{opacity:1;}
.act-btn{width:26px;height:26px;background:rgba(26,16,8,0.88);border:1px solid rgba(196,168,130,0.2);color:var(--sepia);font-size:0.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all 0.2s;}
.act-btn:hover{border-color:var(--gold);color:var(--gold);}
.act-btn.del{border-color:rgba(255,100,100,0.3);color:#e07070;}
.act-btn.del:hover{border-color:#e07070;}
.drag-handle{position:absolute;top:0.4rem;left:0.4rem;width:24px;height:24px;background:rgba(26,16,8,0.75);border:1px solid rgba(196,168,130,0.18);color:var(--sepia);display:flex;align-items:center;justify-content:center;font-size:0.65rem;cursor:grab;opacity:0;transition:opacity 0.2s;}
.work-item:hover .drag-handle{opacity:1;}
.empty-state{text-align:center;padding:3rem;color:var(--warm-brown);font-style:italic;}

/* EDIT MODAL */
#edit-modal{position:fixed;inset:0;z-index:900;background:rgba(10,5,2,0.9);display:none;align-items:center;justify-content:center;padding:1rem;}
#edit-modal.open{display:flex;}
.modal-box{background:#1e100a;border:1px solid rgba(196,168,130,0.2);padding:2rem;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:0.7rem;letter-spacing:0.28em;color:var(--gold);text-transform:uppercase;margin-bottom:1.5rem;padding-bottom:0.8rem;border-bottom:1px solid rgba(196,168,130,0.1);display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:none;border:none;color:var(--sepia);font-size:1.2rem;cursor:pointer;transition:color 0.2s;}
.modal-close:hover{color:var(--gold);}
.current-imgs{display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;}
.cur-img{position:relative;width:76px;height:76px;}
.cur-img img{width:100%;height:100%;object-fit:cover;border:1px solid rgba(196,168,130,0.2);}
.cur-img.is-cover::after{content:'Cover';position:absolute;bottom:0;left:0;right:0;background:rgba(201,168,76,0.85);color:#1a1008;font-size:0.45rem;letter-spacing:0.1em;text-align:center;padding:0.15rem;text-transform:uppercase;}
.cur-img-del{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:rgba(26,16,8,0.9);border:1px solid rgba(255,100,100,0.4);color:#e07070;font-size:0.55rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}

/* FOCAL POINT PICKER */
.focal-wrap{position:relative;margin-top:0.8rem;display:none;}
.focal-wrap.show{display:block;}
.focal-label{font-size:0.6rem;letter-spacing:0.2em;color:var(--sepia);text-transform:uppercase;margin-bottom:0.4rem;display:block;}
.focal-frame{position:relative;width:100%;max-width:320px;overflow:hidden;border:1px solid rgba(196,168,130,0.2);border-radius:4px;cursor:crosshair;user-select:none;transition:aspect-ratio 0.2s;}
.focal-frame img{width:100%;height:auto;object-fit:cover;display:block;pointer-events:none;}
.focal-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,0.5);top:50%;left:50%;}
.focal-hint{font-size:0.58rem;color:var(--warm-brown);font-style:italic;margin-top:0.4rem;opacity:0.7;}
.focal-val{font-size:0.58rem;color:var(--gold);font-family:monospace;margin-top:0.2rem;}

/* ADMIN TABS */
.admin-tabs{display:flex;gap:0;border-bottom:1px solid rgba(196,168,130,0.15);margin-bottom:2rem;}
.admin-tab{font-family:'Georgia',serif;font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--warm-brown);background:none;border:none;border-bottom:2px solid transparent;padding:0.8rem 1.5rem;cursor:pointer;transition:all 0.2s;}
.admin-tab:hover{color:var(--sepia);}
.admin-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.admin-pane{display:none;}
.admin-pane.active{display:block;}

</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <p class="login-logo">W Studio</p>
    <p class="login-sub">後台管理系統</p>
    <p class="login-desc">用你的 Google 帳號登入，<br>即可上傳與管理作品。</p>
    <button class="btn-google" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#1a1008"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#3d2b1f"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#1a1008"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#3d2b1f"/></svg>
      以 Google 帳號登入
    </button>
    <p class="login-note">僅授權帳號可進入後台</p>
    <p class="err-msg" id="err-msg"></p>
  </div>
</div>


<div id="admin-panel">
  <nav class="admin-nav">
    <span class="admin-nav-logo">
    <svg width="90" height="24" viewBox="0 0 90 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;margin-right:0.5rem;">
      <text x="0" y="19" font-family="Cormorant Garamond, Georgia, serif" font-size="20" font-weight="300" letter-spacing="2" fill="#c9a84c">Wish W</text>
    </svg>
    <span style="font-size:0.62rem;letter-spacing:0.28em;color:var(--warm-brown);text-transform:uppercase;vertical-align:middle;">— 後台</span>
  </span>
    <div class="nav-user">
      <img class="nav-avatar" id="nav-avatar" src="" alt="">
      <span id="nav-name"></span>
      <button class="btn-sm" onclick="doLogout()">登出</button>
    </div>
  </nav>
  
  <div class="admin-body">
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchPane('upload')">✦ 上傳作品</button>
      <button class="admin-tab" onclick="switchPane('uploaded')">✦ 已上傳作品</button>
      <button class="admin-tab" onclick="switchPane('about')">✦ 關於我</button>
      <button class="admin-tab" onclick="switchPane('contact')">✦ 聯絡資訊</button>
    </div>

    <div class="admin-pane active" id="pane-upload">
      <div class="card">
        <p class="card-title">✦ 上傳新作品</p>
        <div class="form-grid">
          <div class="form-field"><label>作品名稱</label><input type="text" id="f-title" placeholder="無題 #001"></div>
          <div class="form-field"><label>年份</label><input type="text" id="f-year" placeholder="2024"></div>
          <div class="form-field"><label>類別</label>
            <select id="f-category">
              <option value="film">底片攝影 Film</option>
              <option value="street">街頭攝影 Street</option>
              <option value="portrait">人像攝影 Portrait</option>
              <option value="styling">風格排版 Styling</option>
              <option value="atmosphere">氛圍攝影 Atmosphere</option>
              <option value="product">商品攝影 Product</option>
              <option value="pet">寵物電繪 Pet</option>
              <option value="digital">電繪插畫 Digital Art</option>
            </select>
          </div>
          <div class="form-field"><label>媒材 / 備注</label><input type="text" id="f-medium" placeholder="35mm · Kodak Gold 200"></div>
          <div class="form-field"><label>封面圖方向</label>
            <select id="f-orient" onchange="updateFocalHeight('f-focal-frame',this.value)">
              <option value="portrait">直式 Portrait（高 &gt; 寬）</option>
              <option value="landscape">橫式 Landscape（寬 &gt; 高）</option>
              <option value="square">方形 Square</option>
            </select>
          </div>
          <div class="form-field full">
            <label>封面顯示焦點</label>
            <div class="focal-wrap" id="f-focal-wrap">
              <div class="focal-frame" id="f-focal-frame">
                <img src="" alt="封面預覽">
                <div class="focal-dot" id="f-focal-dot"></div>
              </div>
              <p class="focal-hint">點擊或拖曳選擇焦點位置</p>
              <p class="focal-val">50% 50%</p>
            </div>
            <input type="hidden" id="f-focal-x" value="50">
            <input type="hidden" id="f-focal-y" value="50">
          </div>
          <div class="form-field full">
            <label>封面圖（主圖）</label>
            <div class="drop-zone" id="cover-zone" onclick="document.getElementById('cover-input').click()">
              <p><strong>點擊選擇</strong>或拖曳封面圖<br><span style="font-size:0.65rem;opacity:0.6">建議 2000px 以上</span></p>
            </div>
            <img class="cover-preview" id="cover-preview">
            <input type="file" id="cover-input" accept="image/*" style="display:none">
          </div>
          <div class="form-field full">
            <label>其他照片（最多 9 張）</label>
            <div class="drop-zone" id="extras-zone" onclick="document.getElementById('extras-input').click()">
              <p><strong>點擊選擇</strong>或拖曳其他照片</p>
            </div>
            <div class="thumbs" id="extras-preview"></div>
            <input type="file" id="extras-input" accept="image/*" multiple style="display:none">
          </div>
        </div>
        <div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="progress-bar"></div></div>
        <p class="upload-status" id="upload-status"></p>
        <button class="btn-primary" id="btn-upload" onclick="uploadWork()">↑ 上傳作品</button>
      </div>
    </div>

    <div class="admin-pane" id="pane-uploaded">
      <div class="card">
        <p class="card-title">
          <span>✦ 已上傳作品</span>
          <span class="sort-saved" id="sort-saved">已儲存順序 ✓</span>
        </p>
        <div class="tab-bar">
          <button class="tab active" onclick="switchTab(event,'all')">全部</button>
          <button class="tab" onclick="switchTab(event,'film')">底片</button>
          <button class="tab" onclick="switchTab(event,'street')">街頭</button>
          <button class="tab" onclick="switchTab(event,'portrait')">人像</button>
          <button class="tab" onclick="switchTab(event,'styling')">風格排版</button>
          <button class="tab" onclick="switchTab(event,'atmosphere')">氛圍</button>
          <button class="tab" onclick="switchTab(event,'product')">商品</button>
          <button class="tab" onclick="switchTab(event,'pet')">寵物</button>
          <button class="tab" onclick="switchTab(event,'digital')">電繪</button>
        </div>
        <p class="sort-hint">☰ 拖曳卡片調整前台顯示順序</p>
        <div id="works-list"><p class="empty-state">載入中…</p></div>
      </div>
    </div>

    <div class="admin-pane" id="pane-about">
      <div class="card" id="about-card">
        <p class="card-title">✦ 關於我 About</p>
        <div class="form-grid">
          <div class="form-field full">
            <label>個人照片</label>
            <div class="drop-zone" id="about-zone" onclick="document.getElementById('about-input').click()">
              <p><strong>點擊選擇</strong>或拖曳個人照片</p>
            </div>
            <img class="cover-preview" id="about-preview">
            <input type="file" id="about-input" accept="image/*" style="display:none">
          </div>
          <div class="form-field full">
            <label>第一段介紹</label>
            <textarea id="about-p1" rows="3" style="width:100%;padding:0.6rem 0.8rem;background:rgba(0,0,0,0.3);border:1px solid rgba(196,168,130,0.15);color:var(--cream);font-size:0.85rem;font-family:Georgia,serif;outline:none;resize:vertical;"></textarea>
          </div>
          <div class="form-field full">
            <label>第二段介紹</label>
            <textarea id="about-p2" rows="3" style="width:100%;padding:0.6rem 0.8rem;background:rgba(0,0,0,0.3);border:1px solid rgba(196,168,130,0.15);color:var(--cream);font-size:0.85rem;font-family:Georgia,serif;outline:none;resize:vertical;"></textarea>
          </div>
          <div class="form-field full">
            <label>第三段介紹</label>
            <textarea id="about-p3" rows="3" style="width:100%;padding:0.6rem 0.8rem;background:rgba(0,0,0,0.3);border:1px solid rgba(196,168,130,0.15);color:var(--cream);font-size:0.85rem;font-family:Georgia,serif;outline:none;resize:vertical;"></textarea>
          </div>
        </div>
        <div class="upload-progress" id="about-progress"><div class="upload-progress-bar" id="about-bar"></div></div>
        <p class="upload-status" id="about-status"></p>
        <button class="btn-primary" id="about-save-btn" onclick="saveAbout()">儲存關於我</button>
      </div>
    </div>

    <div class="admin-pane" id="pane-contact">
      <div class="card">
        <p class="card-title">✦ 聯絡資訊</p>
        <div class="form-grid">

// CLOUDINARY
async function cloudinaryUpload(file, onP){
  const fd=new FormData();
  fd.append('file',file); fd.append('upload_preset',CLOUDINARY_PRESET); fd.append('folder','portfolio');
  return new Promise((res,rej)=>{
    const xhr=new XMLHttpRequest();
    xhr.upload.onprogress=e=>{if(e.lengthComputable&&onP)onP(e.loaded/e.total);};
    xhr.onload=()=>{const d=JSON.parse(xhr.responseText);if(xhr.status===200)res(d.secure_url);else rej(new Error(d.error?.message||'失敗'));};
    xhr.onerror=()=>rej(new Error('網路錯誤'));
    xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`);
    xhr.send(fd);
  });
}

function sortW(arr){
  return [...arr].sort((a,b)=>{
    const ah=a.sortOrder!=null,bh=b.sortOrder!=null;
    if(ah&&bh)return a.sortOrder-b.sortOrder;
    if(ah)return -1;if(bh)return 1;
    return (b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0);
  });
}

function initSort(){
  const grid=document.getElementById('sortable');
  if(!grid)return;
  grid.querySelectorAll('.work-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{item.classList.add('dragging-item');e.dataTransfer.effectAllowed='move';});
    item.addEventListener('dragend',()=>{item.classList.remove('dragging-item');grid.querySelectorAll('.work-item').forEach(i=>i.classList.remove('drag-over'));});
    item.addEventListener('dragover',e=>{e.preventDefault();if(item!==document.querySelector('.dragging-item')){grid.querySelectorAll('.work-item').forEach(i=>i.classList.remove('drag-over'));item.classList.add('drag-over');}});
    item.addEventListener('drop',async e=>{
      e.preventDefault();item.classList.remove('drag-over');
      const src=document.querySelector('.dragging-item');
      if(!src||src===item)return;
      const items=[...grid.querySelectorAll('.work-item')];
      if(items.indexOf(src)<items.indexOf(item))item.after(src);else item.before(src);
      await saveOrder();
    });
  });
}
async function saveOrder(){
  const grid=document.getElementById('sortable');if(!grid)return;
  const items=[...grid.querySelectorAll('.work-item')];
  const batch=writeBatch(db);
  items.forEach((el,i)=>batch.update(doc(db,'works',el.dataset.id),{sortOrder:i}));
  await batch.commit();
  const hint=document.getElementById('sort-saved');
  hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),2000);
  items.forEach((el,i)=>{const w=allWorks.find(x=>x.id===el.dataset.id);if(w)w.sortOrder=i;});

// ── FOCAL POINT PICKER ──
window.updateFocalHeight=function(frameId, orient){
  const frame=document.getElementById(frameId);
  if(!frame) return;
  if(orient==='portrait') frame.style.aspectRatio='1668/2388';
  else if(orient==='landscape') frame.style.aspectRatio='2388/1668';
  else frame.style.aspectRatio='1/1';
};
function initFocalPicker(frameId, dotId, xId, yId, imgSrc, orient){
  const frame=document.getElementById(frameId);
  const dot=document.getElementById(dotId);
  const xIn=document.getElementById(xId);
  const yIn=document.getElementById(yId);
  if(!frame||!imgSrc) return;
  const img=frame.querySelector('img');
  img.src=imgSrc;
  // Adjust preview aspect-ratio based on orientation
  if(orient==='portrait') frame.style.aspectRatio='1668/2388';
  else if(orient==='landscape') frame.style.aspectRatio='2388/1668';
  else frame.style.aspectRatio='1/1';
  img.style.height='100%';
  img.style.position='absolute';
  img.style.inset='0';
  frame.style.position='relative';
  frame.closest('.focal-wrap').classList.add('show');

  function setPos(e){
    const rect=frame.getBoundingClientRect();
    const x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    const y=Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));
    dot.style.left=(x*100)+'%';
    dot.style.top=(y*100)+'%';
    xIn.value=Math.round(x*100);
    yIn.value=Math.round(y*100);
    const xPct=Math.round(x*100)+'%';
    const yPct=Math.round(y*100)+'%';
    frame.closest('.focal-wrap').querySelector('.focal-val').textContent=xPct+' '+yPct;
    // update preview img
    frame.querySelector('img').style.objectPosition=xPct+' '+yPct;
  }

  let down=false;
  frame.addEventListener('mousedown', e=>{down=true; setPos(e);});
  frame.addEventListener('touchstart', e=>{down=true; setPos(e.touches[0]);},{passive:true});
  document.addEventListener('mouseup', ()=>down=false);
  document.addEventListener('touchend', ()=>down=false);
  frame.addEventListener('mousemove', e=>{if(down) setPos(e);});
  frame.addEventListener('touchmove', e=>{if(down) setPos(e.touches[0]);},{passive:true});
  frame.addEventListener('click', setPos);
}

function getFocalValue(xId, yId){
  const x=document.getElementById(xId)?.value||'50';
  const y=document.getElementById(yId)?.value||'50';
  return x+'% '+y+'%';
}

function setFocalDot(frameId, dotId, xId, yId, focalPoint){
  if(!focalPoint||focalPoint==='center') focalPoint='50% 50%';
  const parts=focalPoint.split(' ');
  const x=parseFloat(parts[0])||50;
  const y=parseFloat(parts[1])||50;
  const dot=document.getElementById(dotId);
  if(dot){ dot.style.left=x+'%'; dot.style.top=y+'%'; }
  const xIn=document.getElementById(xId); if(xIn) xIn.value=x;
  const yIn=document.getElementById(yId); if(yIn) yIn.value=y;
  const frame=document.getElementById(frameId);
  if(frame){
    frame.querySelector('img').style.objectPosition=x+'% '+y+'%';
    frame.closest('.focal-wrap').querySelector('.focal-val').textContent=x+'% '+y+'%';
  }
}

  document.querySelectorAll('.admin-tab').forEach((t,i)=>{
    const panes=['upload','uploaded','about','contact'];
    t.classList.toggle('active', panes[i]===name);
  });
  document.querySelectorAll('.admin-pane').forEach(p=>{
    p.classList.toggle('active', p.id==='pane-'+name);
  });
};

// ── CONTACT SETTINGS ──
async function loadContact(){
  try {
    const { doc: fd, getDoc: fg } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const snap = await fg(fd(db,'settings','contact'));
    if(!snap.exists()) return;
    const d = snap.data();
    if(d.ig)       document.getElementById('c-ig').value = d.ig;
    if(d.email)    document.getElementById('c-email').value = d.email;
    if(d.igUrl)    document.getElementById('c-ig-url').value = d.igUrl;
    if(d.location) document.getElementById('c-location').value = d.location;
  } catch(e){ console.log('no contact data'); }
}

window.saveContact = async () => {
  const status = document.getElementById('contact-status');
  status.textContent = '儲存中…';
  try {
    const { doc: fd, setDoc: fs } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    await fs(fd(db,'settings','contact'), {
      ig:       document.getElementById('c-ig').value.trim(),
      email:    document.getElementById('c-email').value.trim(),
      igUrl:    document.getElementById('c-ig-url').value.trim(),
      location: document.getElementById('c-location').value.trim(),
      updatedAt: new Date()
    }, {merge:true});
    status.textContent = '✓ 儲存成功！';
    setTimeout(()=>status.textContent='', 2000);
  } catch(e){ status.textContent='失敗：'+e.message; }
};

// ── ABOUT SETTINGS ──
let aboutPhotoFile = null;

// Load existing about data
async function loadAbout(){
  try {
    const snap = await getDocs(collection(db,'settings'));
    snap.forEach(d => {
      if(d.id === 'about'){
        const data = d.data();
        if(data.photoUrl){
          const p = document.getElementById('about-preview');
          p.src = data.photoUrl; p.style.display='block';
        }
        if(data.p1) document.getElementById('about-p1').value = data.p1;
        if(data.p2) document.getElementById('about-p2').value = data.p2;
        if(data.p3) document.getElementById('about-p3').value = data.p3;
      }
    });
  } catch(e){ console.log('no about data yet'); }
}

// About photo drop zone
const aboutInput = document.getElementById('about-input');
const aboutZone  = document.getElementById('about-zone');
const aboutPrev  = document.getElementById('about-preview');
aboutInput.addEventListener('change', e => setAboutPhoto(e.target.files[0]));
aboutZone.addEventListener('dragover',  e => { e.preventDefault(); aboutZone.classList.add('dragover'); });
aboutZone.addEventListener('dragleave', () => aboutZone.classList.remove('dragover'));
aboutZone.addEventListener('drop', e => { e.preventDefault(); aboutZone.classList.remove('dragover'); setAboutPhoto(e.dataTransfer.files[0]); });
function setAboutPhoto(f){
  if(!f) return; aboutPhotoFile = f;
  const r = new FileReader();
  r.onload = e => { aboutPrev.src=e.target.result; aboutPrev.style.display='block'; };
  r.readAsDataURL(f);
}

window.saveAbout = async () => {
  const btn    = document.getElementById('about-save-btn');
  const pWrap  = document.getElementById('about-progress');
  const bar    = document.getElementById('about-bar');
  const status = document.getElementById('about-status');
  const p1 = document.getElementById('about-p1').value.trim();
  const p2 = document.getElementById('about-p2').value.trim();
  const p3 = document.getElementById('about-p3').value.trim();
  btn.disabled = true; pWrap.style.display='block'; status.textContent='儲存中…';
  try {
    let photoUrl = null;
    if(aboutPhotoFile){
      status.textContent='上傳照片…'; bar.style.width='30%';
      photoUrl = await cloudinaryUpload(aboutPhotoFile);
      bar.style.width='70%';
    }
    // Use setDoc to upsert the about document
    const { doc: firestoreDoc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const ref = firestoreDoc(db,'settings','about');
    const existing = {};
    if(photoUrl) existing.photoUrl = photoUrl;
    existing.p1 = p1; existing.p2 = p2; existing.p3 = p3;
    existing.updatedAt = new Date();
    await setDoc(ref, existing, {merge:true});
    bar.style.width='100%'; status.textContent='✓ 儲存成功！';
    setTimeout(()=>{ pWrap.style.display='none'; bar.style.width='0%'; status.textContent=''; },2000);
    btn.disabled = false; aboutPhotoFile = null;
  } catch(e){ status.textContent='失敗：'+e.message; btn.disabled=false; }
};
